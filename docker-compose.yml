# One-command local demo (D4): FalkorDB + FastAPI backend + nginx-served cockpit.
#   docker compose up --build            → http://localhost:5173
#   docker compose stop falkordb         → cockpit shows ErrorScreen (rule 3)
# No secrets here: only non-secret host/port. See .env.example.

name: graphhacks

services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"   # Redis protocol (backend + host clients)
      - "3000:3000"   # FalkorDB Browser UI
    volumes:
      - falkordb-data:/var/lib/falkordb/data

  backend:
    build:
      context: .                 # repo root: bake graphify-out/graph.json
      dockerfile: backend/Dockerfile
    # Optional: load Nebius/Tavily/LangSmith keys from a root `.env` if present.
    # `required: false` keeps the keyless path working when there is no `.env`.
    env_file:
      - path: .env
        required: false
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      REPO_ROOT: /repo           # routes_tracks resolves artifacts here
    # Track 01/03 sync needs the live AST graph and git history; ingest_docs
    # reads the on-disk docs. Read-only so the demo cannot mutate the checkout.
    volumes:
      - ./graphify-out:/repo/graphify-out:ro
      - ./.git:/repo/.git:ro
      - ./docs:/repo/docs:ro
      - ./reference:/repo/reference:ro
      - ./lessons:/repo/lessons:ro
    # No host port: nginx (frontend) reaches it as http://backend:8000 on the
    # compose network. Avoids colliding with a host-run `uvicorn` on 8000.
    depends_on:
      - falkordb

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  falkordb-data:
