# nginx for the containerized cockpit (F5). Serves the Vite build and forwards
# every /api/* request to the FastAPI backend on the compose network. If the
# backend (or FalkorDB behind it) is down, the backend answers 503 and the
# cockpit shows ErrorScreen — no silent fallback (rule 3).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The FastAPI routes are already /api/... — proxy without a trailing slash
    # on the upstream so the path is preserved.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown paths render index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
